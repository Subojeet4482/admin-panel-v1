services:
  - type: web
    name: ff-main
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_PIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FIREBASE_CREDENTIALS_B64
        sync: false
      - key: FIREBASE_CREDENTIALS_B641
        sync: false
      - key: CHAT_CORS_ORIGIN
        value: "*"
      - key: LOGIN_MAX_FAILS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "60"
      - key: PANEL_MAIN_URL
        sync: false
      - key: PANEL_PAYMENT_URL
        sync: false
      - key: PANEL_BACKUP_URL
        sync: false
      - key: UPTIMEROBOT_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: KEEPALIVE
        value: "true"
      - key: KEEPALIVE_INTERVAL
        value: "600"
      - key: SLOW_FACTOR
        value: "1"
